  <script>
    // ==========================================
    // 0. 返回顶部浮动按钮逻辑 (滑动超一屏触发)
    // ==========================================
    const backToTopBtn = document.getElementById("btn-back-to-top");
    if (backToTopBtn) {
      let isVisible = false;
      const checkScrollPosition = () => {
        const threshold = window.innerHeight * 0.8;
        const shouldShow = window.scrollY >= threshold;
        if (shouldShow !== isVisible) {
          isVisible = shouldShow;
          backToTopBtn.classList.toggle("is-visible", shouldShow);
        }
      };

      window.addEventListener("scroll", checkScrollPosition, { passive: true });
      checkScrollPosition();

      backToTopBtn.addEventListener("click", () => {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      });
    }

    // ==========================================
    // 1. 页面加载完成与入场触发
    // ==========================================
    const pageCurtain = document.getElementById("page-curtain");
    function revealPage() {
      if (pageCurtain) {
        pageCurtain.classList.remove("is-active");
      }
      document.body.classList.add("is-loaded");

      // 确保页面内所有 video 均正确启动播放
      document.querySelectorAll("video").forEach(v => {
        v.play().catch(() => {});
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", revealPage);
    } else {
      revealPage();
    }
    window.addEventListener("pageshow", revealPage);

    // ==========================================
    // 2. 智能识别来源：如果是从项目列表进入，则返回项目列表；否则返回首页
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const isFromProjects = urlParams.get("from") === "projects" || 
                           (document.referrer && document.referrer.includes("projects.html"));
    
    const targetBackUrl = isFromProjects ? "projects.html" : "index.html";
    const targetBackText = isFromProjects ? "返回全部项目" : "返回首页";

    const topBackBtn = document.getElementById("btn-back-home");
    const bottomBackBtn = document.getElementById("btn-back-bottom");

    function applyBackButtonInfo(btn) {
      if (!btn) return;
      btn.setAttribute("href", targetBackUrl);
      btn.setAttribute("title", targetBackText);
      const textSpan = btn.querySelector("span:last-child");
      if (textSpan) textSpan.textContent = targetBackText;
    }

    applyBackButtonInfo(topBackBtn);
    applyBackButtonInfo(bottomBackBtn);

    function smoothNavigateBack(e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      e.preventDefault();
      if (pageCurtain) {
        pageCurtain.classList.add("is-active");
      }
      setTimeout(() => {
        window.location.href = targetBackUrl;
      }, 240);
    }

    topBackBtn?.addEventListener("click", smoothNavigateBack);
    bottomBackBtn?.addEventListener("click", smoothNavigateBack);

    // 绑定 Shot-Well 卡片点击跳转至对应作品详情页
    document.querySelectorAll(".shotwell-card").forEach(card => {
      card.addEventListener("click", () => {
        const targetUrl = card.dataset.projectUrl;
        if (!targetUrl) return;
        if (pageCurtain) {
          pageCurtain.classList.add("is-active");
        }
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 240);
      });
    });

    // ==========================================
    // 3. 项目卡片 3D 鼠标跟随微倾斜与光斑动力学系统
    // ==========================================
    function initShotwellCard3DTilt() {
      const cards = document.querySelectorAll(".shotwell-card");
      if (!cards.length) return;

      cards.forEach(card => {
        let glare = card.querySelector(".shotwell-glare");
        if (!glare) {
          glare = document.createElement("div");
          glare.className = "shotwell-glare";
          card.appendChild(glare);
        }

        const artboard = card.querySelector(".shotwell-artboard");
        let bounds = null;
        let rafId = null;
        let targetRotateX = 0;
        let targetRotateY = 0;
        let currentRotateX = 0;
        let currentRotateY = 0;
        let isHovering = false;

        function updateTransform() {
          if (!isHovering) {
            currentRotateX += (0 - currentRotateX) * 0.14;
            currentRotateY += (0 - currentRotateY) * 0.14;

            if (Math.abs(currentRotateX) < 0.05 && Math.abs(currentRotateY) < 0.05) {
              card.style.transform = "";
              card.style.zIndex = "";
              card.style.transition = "";
              if (artboard) {
                artboard.style.transform = "";
                artboard.style.transition = "";
              }
              if (glare) glare.style.opacity = "0";
              rafId = null;
              return;
            }
          } else {
            currentRotateX += (targetRotateX - currentRotateX) * 0.16;
            currentRotateY += (targetRotateY - currentRotateY) * 0.16;
          }

          card.style.transform = `perspective(1000px) rotateX(${currentRotateX.toFixed(2)}deg) rotateY(${currentRotateY.toFixed(2)}deg) translateY(-4px)`;
          if (artboard) {
            artboard.style.transform = `translateZ(10px)`;
          }

          rafId = requestAnimationFrame(updateTransform);
        }

        card.addEventListener("pointerenter", () => {
          bounds = card.getBoundingClientRect();
          isHovering = true;
          card.style.zIndex = "10";
          card.style.transition = "none";
          if (artboard) artboard.style.transition = "transform 0.1s ease-out, box-shadow 0.3s ease";
          if (glare) glare.style.opacity = "1";
          if (!rafId) {
            rafId = requestAnimationFrame(updateTransform);
          }
        });

        card.addEventListener("pointermove", (e) => {
          if (!bounds) bounds = card.getBoundingClientRect();
          const posX = e.clientX - bounds.left;
          const posY = e.clientY - bounds.top;

          const normX = (posX / bounds.width - 0.5) * 2;
          const normY = (posY / bounds.height - 0.5) * 2;

          const maxTilt = 7;
          targetRotateY = normX * maxTilt;
          targetRotateX = -normY * maxTilt;

          if (glare) {
            glare.style.background = `radial-gradient(circle at ${posX}px ${posY}px, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 65%)`;
          }

          if (!rafId) {
            rafId = requestAnimationFrame(updateTransform);
          }
        });

        card.addEventListener("pointerleave", () => {
          isHovering = false;
          bounds = null;
        });
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initShotwellCard3DTilt);
    } else {
      initShotwellCard3DTilt();
    }

    // ==========================================
    // 4. 邮箱复制与 Toast 轻提示逻辑
    // ==========================================
    let toastTimeout = null;
    function showToast(message, email) {
      let toast = document.getElementById("global-toast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "global-toast";
        toast.className = "global-toast";
        document.body.appendChild(toast);
      }
      
      const emailHtml = email ? `<span class="toast-email-val">(${email})</span>` : "";
      toast.innerHTML = `
        <span class="toast-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <span class="toast-text">${message}${emailHtml}</span>
      `;
      
      toast.classList.remove("toast-hide");
      toast.classList.add("toast-show");
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("toast-show");
        toast.classList.add("toast-hide");
        setTimeout(() => {
          if (toast && toast.classList.contains("toast-hide")) {
            toast.remove();
          }
        }, 260);
      }, 2400);
    }

    function copyContactEmail(email, btnEl) {
      const emailText = email || "yanjq957@gmail.com";
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(emailText).catch(() => fallbackCopy(emailText));
      } else {
        fallbackCopy(emailText);
      }

      showToast("复制成功", emailText);

      if (btnEl) {
        const originalContent = btnEl.innerHTML;
        btnEl.innerHTML = `
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #22c55e;">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span style="color: #22c55e;">已复制成功</span>
        `;
        setTimeout(() => {
          btnEl.innerHTML = originalContent;
        }, 2000);
      }
    }

    function fallbackCopy(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      textArea.style.left = "-9999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand("copy");
      } catch (err) {
        console.error("Fallback copy failed", err);
      }
      document.body.removeChild(textArea);
    }

    // ==========================================
    // 5. 主题切换与系统偏好实时同步
    // ==========================================
    const themeBtn = document.getElementById("btn-theme-toggle");
    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const nextTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", nextTheme);
        localStorage.setItem("site-theme", nextTheme);
      });
    }

    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
        if (!localStorage.getItem("site-theme")) {
          document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
        }
      });
    }

    window.addEventListener("storage", (e) => {
      if (e.key === "site-theme" && e.newValue) {
        document.documentElement.setAttribute("data-theme", e.newValue);
      }
    });

    // ==========================================================================
    // 6. 智能自顶向下视频流式加载引擎 (Top-Down Video Stream & Skeleton Queue)
    // 优先集中带宽加载首屏「第一页.mp4」，其余 12 个小视频严格按 2 个并发逐个流水线加载，杜绝带宽争抢
    // ==========================================================================
    function initProgressiveVideoStream() {
      const bannerVideo = document.querySelector("#placeholder-1 video");
      const iconVideos = Array.from(document.querySelectorAll(".icon-motion-video"));
      const loadedSet = new Set();
      let activeLoadingCount = 0;
      const MAX_CONCURRENT_VIDEOS = 2; // 限制同时加载视频数，集中带宽加速首帧呈现
      let sequentialIndex = 0;

      function attachVideoLifecycle(video) {
        const parentHolder = video.closest(".detail-image-placeholder, .icon-motion-card");
        
        function markLoaded() {
          video.classList.add("is-loaded");
          if (parentHolder) parentHolder.classList.add("is-loaded");
          video.play().catch(() => {});
        }

        if (video.readyState >= 2) {
          markLoaded();
        } else {
          video.addEventListener("loadeddata", markLoaded, { once: true });
          video.addEventListener("canplay", markLoaded, { once: true });
          video.addEventListener("playing", markLoaded, { once: true });
        }
      }

      function loadSingleVideo(video) {
        if (!video || loadedSet.has(video)) return;
        loadedSet.add(video);

        if (!video.src && video.dataset.src) {
          activeLoadingCount++;
          video.src = video.dataset.src;
          video.load();
          attachVideoLifecycle(video);

          const onBufferedEnough = () => {
            activeLoadingCount = Math.max(0, activeLoadingCount - 1);
            pumpVideoQueue();
          };

          if (video.readyState >= 2) {
            onBufferedEnough();
          } else {
            video.addEventListener("loadeddata", onBufferedEnough, { once: true });
            video.addEventListener("canplay", onBufferedEnough, { once: true });
            video.addEventListener("error", onBufferedEnough, { once: true });
          }
        }
      }

      function pumpVideoQueue() {
        while (activeLoadingCount < MAX_CONCURRENT_VIDEOS && sequentialIndex < iconVideos.length) {
          const nextVideo = iconVideos[sequentialIndex++];
          if (nextVideo && !loadedSet.has(nextVideo)) {
            loadSingleVideo(nextVideo);
          }
        }
      }

      // 1. 首屏优先级最高：优先确保顶部「第一页.mp4」立刻获取 100% 带宽
      if (bannerVideo) {
        attachVideoLifecycle(bannerVideo);
        if (bannerVideo.readyState >= 2) {
          pumpVideoQueue();
        } else {
          bannerVideo.addEventListener("loadeddata", () => pumpVideoQueue(), { once: true });
          bannerVideo.addEventListener("canplay", () => pumpVideoQueue(), { once: true });
          setTimeout(() => pumpVideoQueue(), 600); // 600ms 兜底预热
        }
      } else {
        pumpVideoQueue();
      }

      // 2. 视口加急探测 (IntersectionObserver)：用户快速向下滚动时，视口内的视频优先插队加载
      if ("IntersectionObserver" in window) {
        const viewportObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const targetVideo = entry.target.querySelector(".icon-motion-video");
              if (targetVideo && !loadedSet.has(targetVideo)) {
                loadSingleVideo(targetVideo);
              }
              viewportObserver.unobserve(entry.target);
            }
          });
        }, { rootMargin: "300px 0px" });

        document.querySelectorAll(".icon-motion-card").forEach(el => {
          viewportObserver.observe(el);
        });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initProgressiveVideoStream);
    } else {
      initProgressiveVideoStream();
    }
  </script>
</body>
</html>
